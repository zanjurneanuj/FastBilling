name: fast_billing
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Routing
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  google_sign_in: ^6.2.1

  # PDF
  pdf: ^3.10.8
  printing: ^5.13.0

  # Utilities
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.4.0
  sqflite: ^2.4.3
  path: ^1.9.1
  firebase_storage: ^12.2.0
  device_info_plus: ^10.1.2
  network_info_plus: ^7.0.0
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  esc_pos_utils_plus: ^2.0.4
  unified_esc_pos_printer: ^3.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icon/zanvoy_icon_1024.svg"
    adaptive_icon_background: "#16255C"
    adaptive_icon_foreground: "assets/icon/zanvoy_icon_1024.svg"

flutter:
  uses-material-design: true
  assets:
    # - assets/icon/zanvoy_icon_1024.svg
    # - assets/icons/